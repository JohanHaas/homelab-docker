server_url: https://headscale.johanhaas.de
listen_addr: 0.0.0.0:8080

grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

metrics_listen_addr: 0.0.0.0:9090

# Docker bridge subnet, fixed in compose.yaml ipam
trusted_proxies:
  - 172.28.0.0/16

noise:
  private_key_path: /var/lib/headscale/noise_private.key

# Tailscale CGNAT/ULA ranges only, must be subsets of:
# IPv4: 100.64.0.0/10, IPv6: fd7a:115c:a1e0::/48
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 159.69.23.42
    ipv6: 2a01:4f8:c0c:a6d2::1

  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: false

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m
  routes:
    ha:
      probe_interval: 10s
      probe_timeout: 5s

database:
  type: sqlite
  debug: false
  gorm:
    prepare_stmt: true
    parameterized_queries: true
    skip_err_record_not_found: true
    slow_threshold: 1000
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

acme_url: https://acme-v02.api.letsencrypt.org/directory
acme_email: ""
tls_letsencrypt_hostname: ""
tls_letsencrypt_cache_dir: /var/lib/headscale/cache
tls_letsencrypt_challenge_type: HTTP-01
tls_letsencrypt_listen: ":http"
tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: text

policy:
  mode: file
  path: ""

dns:
  magic_dns: true
  base_domain: tailnet.johanhaas.de
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001
    split: {}
  search_domains: []
  extra_records: 
    - { name: "test.johanhaas.de", type: "A", value: "100.64.0.2" }
    - { name: "test.johanhaas.de", type: "AAAA", value: "fd7a:115c:a1e0::2" }

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false

taildrop:
  enabled: true

auto_update:
  enabled: false
